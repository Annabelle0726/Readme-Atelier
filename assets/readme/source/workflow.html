<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>README Atelier · 从素材到成稿</title><link rel="stylesheet" href="workflow.css"></head><body><main><div id="scene-container"></div><div id="player" aria-label="流程动画控制"><div class="controls"><button id="play">播放</button><button id="replay">重播</button><label for="timeline">进度</label><input id="timeline" type="range" min="0" max="20" step="0.05" value="0"><output id="time">00:00 / 00:20</output></div><nav aria-label="选择流程章节"><button data-stage="0">01 读懂项目</button><button data-stage="1">02 选择方向</button><button data-stage="2">03 编排正文</button><button data-stage="3">04 检查交付</button></nav><p id="stage-caption" aria-live="polite"></p><p class="note">流程示意，非操作录屏。使用 Taste Studio 既有配图；画面排版用于讲解 README 制作过程。</p></div></main><script src="workflow.js"></script></body></html>

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Annabelle · README 改版案例</title><style>*{box-sizing:border-box}body{margin:0;background:#fcf6ec;color:#641322;font-family:'Noto Sans SC','Microsoft YaHei',sans-serif}#scene{padding:32px 36px}header{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid #ac7e30;padding-bottom:20px;margin-bottom:24px}h1{font:36px Georgia,serif;margin:0}header p{font-size:17px;margin:0}.spread{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0}figcaption{font-size:16px;display:flex;justify-content:space-between;margin-bottom:12px}figcaption span{font-size:12px;color:#736455}img{display:block;width:100%;height:auto;border:1px solid #d7c9b3}footer{display:flex;gap:22px;border-top:1px solid #d7c9b3;margin-top:24px;padding-top:18px;font-size:14px;color:#736455}@media(max-width:600px){#scene{padding:22px}header{display:block}h1{font-size:30px}header p{margin-top:10px}.spread{grid-template-columns:1fr}.spread figure:first-child{display:none}footer{display:block}footer span{display:block;margin:5px 0}}</style><div id="scene"><header><h1>Annabelle Portfolio</h1><p>留住图，理顺页。</p></header><div class="spread"><figure><figcaption>确定主封面<span>真实 README 预览</span></figcaption><img src="../cases/portfolio-cover-preview.png" alt="作品集改版后的首屏预览"></figure><figure><figcaption>保留关键作品图<span>正文节选</span></figcaption><img src="../cases/portfolio-body-preview.png" alt="作品集改版后的全栈项目图"></figure></div><footer><span>一张主封面</span><span>关键作品直接展示</span><span>技术细节按需展开</span></footer></div><script>window.readmeAtelier={ready:false,duration:1,renderAt(){}};Promise.all([document.fonts.ready,...[...document.images].map(i=>i.decode())]).then(()=>window.readmeAtelier.ready=true);</script></html>
